name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 重新构建 extensions 包，避免仓库中已提交的 dist 落后于源码
      - name: Build extensions
        run: pnpm run build:extensions

      - name: Build application
        run: npx electron-vite build

      # CI 上 pnpm 安装出的 electron/dist 符号链接被物化, codesign 报
      # "bundle format is ambiguous"; 用 ditto 重新解压到隔离目录恢复符号链接
      - name: Prepare Electron dist (macOS)
        if: matrix.platform == 'mac'
        run: |
          ls -la "node_modules/electron/dist/Electron.app/Contents/Frameworks/Electron Framework.framework/"
          ELECTRON_VERSION=$(node -p "require('./node_modules/electron/package.json').version")
          curl -fL -o /tmp/electron.zip "https://github.com/electron/electron/releases/download/v${ELECTRON_VERSION}/electron-v${ELECTRON_VERSION}-darwin-${{ matrix.arch }}.zip"
          rm -rf .electron-dist-ci && mkdir -p .electron-dist-ci
          ditto -x -k /tmp/electron.zip .electron-dist-ci
          ls -la ".electron-dist-ci/Electron.app/Contents/Frameworks/Electron Framework.framework/"

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --config electron-builder.json --mac --${{ matrix.arch }} --config.electronDist=.electron-dist-ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --config electron-builder.json --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SessionBox-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-app/*.dmg
            dist-app/*.exe
            dist-app/*.blockmap
            dist-app/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
