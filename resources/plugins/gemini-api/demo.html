<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Gemini API 调试</title>
<style>
body{font:14px system-ui;margin:24px;max-width:1020px;color:#202124}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:18px 0 6px}
.meta{color:#5f6368;font-size:12px;margin-bottom:12px}
label{display:block;margin:8px 0 2px;font-weight:600}
select,textarea,input{padding:8px;margin:2px 0;width:100%;box-sizing:border-box;font:inherit}
textarea{min-height:90px;font-family:monospace}
.row{display:flex;gap:8px}.row>*{flex:1}
button{padding:8px 16px;margin:8px 8px 0 0;cursor:pointer}
button.sec{background:#f1f3f4;border:none}
#result{white-space:pre-wrap;background:#f8f9fa;border:1px solid #e0e0e0;padding:12px;min-height:120px;font-family:monospace;font-size:13px;overflow:auto;max-height:420px}
#result img{max-width:360px;display:block;margin:6px 0}
#result video{display:block;margin:6px 0;max-width:480px}
</style></head>
<body>
<h1>Gemini API 在线调试</h1>
<div class="meta" id="meta">加载中...</div>

<h2>账号（SessionBox 页面）</h2>
<div class="row"><div><label>当前账号</label><select id="page"></select></div>
<div><label>账号状态</label><div id="account" style="padding:8px 0;font-family:monospace;font-size:13px">未查询</div></div></div>
<div><button class="sec" id="reload">刷新账号</button><button class="sec" id="refresh">清空凭据缓存</button></div>

<h2>请求调试</h2>
<label>操作</label>
<select id="api">
  <option value="chat">文本对话（chat/completions，流式）</option>
  <option value="image">文生图（images/generations）</option>
  <option value="video">生成视频（videos/generations，很慢，需模型支持 Veo）</option>
  <option value="models">模型列表（含账号可用模型）</option>
  <option value="logs">服务日志（尾部 100 行）</option>
</select>
<label>模型（留空 = 账号默认）</label><input id="model" placeholder="例如 gemini-flash / 含 image 的生图模型 / 含 veo 的视频模型">
<label>prompt</label>
<textarea id="input">用一句话介绍你自己</textarea>
<label>参考图 URL / dataURL（多模态对话可选）</label>
<input id="images" placeholder="https://...jpg">
<button id="run" style="font-weight:700">执行</button>

<h2>结果</h2>
<div id="result">-</div>

<script>
const query = new URLSearchParams(location.search);
const service = query.get('service') || 'http://127.0.0.1:19205';
const $ = (id) => document.getElementById(id);
const pageSel = $('page'), apiSel = $('api'), result = $('result');

async function call(method, path, body, extraHeaders = {}) {
  const headers = { 'content-type': 'application/json', ...extraHeaders };
  if (pageSel.value && pageSel.value !== 'auto') headers['x-session-page'] = pageSel.value;
  const res = await fetch(service + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let json; try { json = JSON.parse(text); } catch { json = text; }
  return { status: res.status, json, text };
}

function render(data) {
  if (typeof data === 'string') { result.textContent = data; return; }
  if (data.error) { result.textContent = `错误: ${JSON.stringify(data, null, 2)}`; return; }
  // images / videos 响应渲染
  const items = data.data || [];
  const hasMedia = items.some((d) => d.url || d.b64_json);
  if (hasMedia) {
    result.innerHTML = items.map((d) => {
      const url = d.url || `data:image/png;base64,${d.b64_json}`;
      const isVideo = /\.mp4|video/.test(d.url || '') || /video/i.test(String(d.revised_prompt && ''));
      return isVideo ? `<video controls src="${d.url}"></video>` : `<img src="${url}">`;
    }).join('') + `<pre>${JSON.stringify({ ...data, data: items.map((d) => ({ url: d.url ? d.url.slice(0, 80) + '...' : '(b64)' })) }, null, 2)}</pre>`;
    return;
  }
  // chat 响应渲染（markdown 图片）
  const content = data.choices?.[0]?.message?.content;
  if (content) {
    result.innerHTML = content
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">')
      .replace(/\[video\]\(([^)]+)\)/g, '<video controls src="$1"></video>');
    return;
  }
  result.textContent = JSON.stringify(data, null, 2);
}

async function loadMeta() {
  try {
    const health = await call('GET', '/health');
    $('meta').textContent = `服务: ${service} · ${health.json.status || '异常'}`;
    const pages = await call('GET', '/v1/sessionbox/pages');
    pageSel.innerHTML = '<option value="auto">自动（open 优先）</option>' +
      (pages.json.pages || []).map((p) => `<option value="${p.id}">${p.name}（${p.ready ? '就绪' : '未就绪'}${p.open ? '，已打开' : ''}）</option>`).join('');
    $('account').textContent = (pages.json.pages || []).map((p) => `${p.name}: ${p.ready ? 'OK' : p.reason}`).join(' | ') || '无 Gemini 页面';
  } catch (err) {
    $('meta').textContent = `服务不可达: ${service}（${err.message}）`;
  }
}

$('reload').onclick = loadMeta;
$('refresh').onclick = async () => { render(await call('POST', '/v1/sessionbox/refresh', {})); };
$('run').onclick = async () => {
  result.textContent = '请求中...（视频可能需要数分钟）';
  const api = apiSel.value;
  const model = $('model').value.trim();
  const prompt = $('input').value.trim();
  const images = $('images').value.trim() ? $('images').value.trim().split(/[\n,]\s*/).filter(Boolean) : [];
  try {
    if (api === 'models') render(await call('GET', '/v1/models'));
    else if (api === 'logs') render(await call('GET', '/v1/admin/logs?lines=100'));
    else if (api === 'chat') {
      // 流式 SSE
      const headers = { 'content-type': 'application/json' };
      if (pageSel.value !== 'auto') headers['x-session-page'] = pageSel.value;
      const res = await fetch(service + '/v1/chat/completions', {
        method: 'POST', headers,
        body: JSON.stringify({
          model: model || undefined, stream: true,
          messages: [...(images.length ? [{ role: 'user', content: [
            { type: 'text', text: prompt }, ...images.map((u) => ({ type: 'image_url', image_url: { url: u } })),
          ] }] : [{ role: 'user', content: prompt }])],
        }),
      });
      if (!res.ok) { render(await res.json()); return; }
      result.innerHTML = '';
      const pre = document.createElement('pre'); result.appendChild(pre);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const events = buf.split('\n\n'); buf = events.pop();
        for (const ev of events) {
          const line = ev.split('\n').find((l) => l.startsWith('data: '));
          if (!line) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]') continue;
          try {
            const chunk = JSON.parse(payload);
            const delta = chunk.choices?.[0]?.delta?.content || '';
            if (delta) pre.textContent += delta;
            pre.innerHTML = pre.textContent
              .replace(/&/g, '&amp;').replace(/</g, '&lt;')
              .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
          } catch { /* 忽略坏帧 */ }
        }
      }
    } else if (api === 'image') {
      render(await call('POST', '/v1/images/generations', { model: model || undefined, prompt, n: 1 }));
    } else if (api === 'video') {
      render(await call('POST', '/v1/videos/generations', { model: model || undefined, prompt, images, poll_timeout: 600000 }));
    }
  } catch (err) {
    result.textContent = `请求失败: ${err.message}`;
  }
};

loadMeta();
</script>
</body></html>
