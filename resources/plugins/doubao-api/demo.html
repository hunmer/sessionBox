<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Doubao API 调试</title>
<style>body{font:14px system-ui;margin:28px;max-width:980px;color:#202124}select,textarea,button{padding:8px;margin:4px 0}select,textarea{width:100%;box-sizing:border-box}textarea{min-height:180px;font-family:monospace}button{cursor:pointer}.status{white-space:pre-wrap;background:#f5f5f5;padding:12px;min-height:80px}</style></head>
<body><h1>Doubao API 在线调试</h1><p>选择 SessionBox 页面后，可读取会话 Cookie、打开 Doubao 页面或执行 JavaScript。</p>
<label>Doubao 账号页面<select id="page"></select></label><label>API<select id="api"><option value="chat">文本对话</option><option value="image">生成图片</option><option value="video">生成视频</option><option value="audio">生成音频</option><option value="cookies">获取 Cookie 元数据</option><option value="open">打开 Doubao 页面</option><option value="execute">执行 JavaScript</option></select></label>
<textarea id="input">你好，请用一句话介绍自己</textarea><button id="run">执行</button><div id="status" class="status">加载 Doubao 页面列表中...</div>
<script>
const query=new URLSearchParams(location.search), base=query.get('api')||'http://127.0.0.1:19100', service=query.get('service')||'http://127.0.0.1:9090', token=query.get('token')||'', headers=token?{Authorization:`Bearer ${token}`}:{};
const page=document.querySelector('#page'), api=document.querySelector('#api'), input=document.querySelector('#input'), status=document.querySelector('#status');
async function request(path, options={}){const r=await fetch(base+path,{...options,headers:{...headers,...(options.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.error||r.statusText);return data}
async function serviceRequest(path, body){const r=await fetch(service+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error?.message||data.detail||r.statusText);return data}
async function selectAccount(){if(!page.value)throw Error('没有可用的 Doubao 页面');return serviceRequest('/v1/sessionbox/page',{page_id:page.value})}
async function load(){try{const data=await request('/api/v1/pages');const allowed=data.pages.filter(p=>{try{const host=new URL(p.currentUrl||p.url).hostname;return host==='doubao.com'||host.endsWith('.doubao.com')}catch(_){return false}});allowed.forEach(p=>page.add(new Option(`${p.name} - ${p.currentUrl||p.url}`,p.id)));status.textContent=`已加载 ${allowed.length} 个 Doubao 页面（共 ${data.pages.length} 个页面）`;}catch(e){status.textContent='加载失败：'+e.message}}
api.onchange=()=>{input.value=api.value==='execute'?'document.title':api.value==='open'?'https://www.doubao.com/chat/':api.value==='image'?'一只可爱的猫在窗边':api.value==='video'?'一只小猫在草地上奔跑':api.value==='audio'?'请生成一段轻快的背景音乐':'你好，请用一句话介绍自己'};
document.querySelector('#run').onclick=async()=>{try{const id=encodeURIComponent(page.value);let data;if(['chat','image','video','audio'].includes(api.value))await selectAccount();if(api.value==='cookies')data=await request(`/api/v1/pages/${id}/cookies?url=https://www.doubao.com`);if(api.value==='open')data=await request(`/api/v1/pages/${id}/open`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:input.value})});if(api.value==='execute')data=await request(`/api/v1/pages/${id}/execute`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:input.value})});if(api.value==='chat')data=await serviceRequest('/v1/chat/completions',{model:'doubao',messages:[{role:'user',content:input.value}],stream:false});if(api.value==='image')data=await serviceRequest('/v1/images/generations',{prompt:input.value,n:1});if(api.value==='video')data=await serviceRequest('/v1/video/generations',{prompt:input.value});if(api.value==='audio')data=await serviceRequest('/v1/audio/generations',{prompt:input.value});status.textContent=JSON.stringify(data,null,2)}catch(e){status.textContent='执行失败：'+e.message}};load();
</script></body></html>
