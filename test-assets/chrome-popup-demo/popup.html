<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SessionBox Popup Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", sans-serif;
        background:
          radial-gradient(circle at top, #fef3c7 0%, transparent 45%),
          linear-gradient(160deg, #fffdf8 0%, #f8fafc 100%);
        color: #1f2937;
      }

      body {
        margin: 0;
        width: 360px;
        min-height: 280px;
      }

      .panel {
        padding: 18px;
      }

      .badge {
        display: inline-block;
        margin-bottom: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        background: #111827;
        color: #f9fafb;
        font-size: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }

      p {
        margin: 0 0 14px;
        color: #4b5563;
        line-height: 1.5;
        font-size: 13px;
      }

      .row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }

      button {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }

      #reloadButton {
        background: #2563eb;
        color: #fff;
      }

      #refreshButton {
        background: #e5e7eb;
        color: #111827;
      }

      .session {
        padding: 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      .session-row {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid #e5e7eb;
        font-size: 12px;
      }

      .session-row:last-child {
        border-bottom: 0;
      }

      .session-label {
        font-size: 12px;
        color: #6b7280;
      }

      .session-value {
        min-width: 0;
        overflow-wrap: anywhere;
        color: #111827;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #4b5563;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="badge">Popup Demo</div>
      <h1>SessionBox 扩展会话</h1>
      <p>查看当前扩展会话，并验证 service worker reload。</p>

      <div class="row">
        <button id="reloadButton" type="button">Reload 扩展</button>
        <button id="refreshButton" type="button">刷新信息</button>
      </div>

      <section class="session" aria-label="当前 Session 信息">
        <div class="session-row"><span class="session-label">扩展 ID</span><span id="extensionId" class="session-value">读取中</span></div>
        <div class="session-row"><span class="session-label">版本</span><span id="version" class="session-value">读取中</span></div>
        <div class="session-row"><span class="session-label">Session URL</span><span id="sessionUrl" class="session-value">读取中</span></div>
        <div class="session-row"><span class="session-label">平台</span><span id="platform" class="session-value">读取中</span></div>
        <div class="session-row"><span class="session-label">Smoke 状态</span><span id="smokeStatus" class="session-value">读取中</span></div>
      </section>
      <div id="status" role="status"></div>
    </main>

    <script src="popup.js"></script>
  </body>
  </html>
